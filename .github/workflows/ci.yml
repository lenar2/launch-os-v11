name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: launch_os_v11_test
          POSTGRES_USER: launch_os_v11
          POSTGRES_PASSWORD: launch_os_v11
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launch_os_v11 -d launch_os_v11_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      LAUNCH_OS_TEST_DATABASE_URL: postgresql+psycopg://launch_os_v11:launch_os_v11@localhost:5432/launch_os_v11_test
      LAUNCH_OS_DATABASE_URL: postgresql+psycopg://launch_os_v11:launch_os_v11@localhost:5432/launch_os_v11_test
      LAUNCH_OS_TEST_REDIS_URL: redis://localhost:6379/0
      LAUNCH_OS_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest -m "not postgres"
      - name: PostgreSQL integration
        run: python -m pytest tests/integration/test_postgresql_gate.py
      - name: Runtime PostgreSQL Redis
        run: python -m pytest -m runtime tests/integration
      - name: AI Runtime PostgreSQL Redis
        run: python -m pytest -m ai_runtime tests/integration
      - name: Decision Workflow PostgreSQL Redis
        run: python -m pytest -m decision_workflow tests/integration
      - name: Production Workflow PostgreSQL Redis
        run: python -m pytest -m production_workflow tests/integration
      - name: Telegram Execution PostgreSQL Redis
        run: python -m pytest -m telegram_execution tests/integration
