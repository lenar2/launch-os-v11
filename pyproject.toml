[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "launch-os-v11"
version = "0.1.0"
description = "Launch OS v11 modular monolith foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "openai>=3.1,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.4,<3.0",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.0,<5.0",
  "httpx>=0.27,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/launch_os_v11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "postgres: requires LAUNCH_OS_TEST_DATABASE_URL against a PostgreSQL 16 database",
  "runtime: requires LAUNCH_OS_TEST_DATABASE_URL and Redis for Phase 2A runtime tests",
  "ai_runtime: requires LAUNCH_OS_TEST_DATABASE_URL and Redis for Phase 2B fake AI runtime tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["launch_os_v11"]
plugins = []

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
