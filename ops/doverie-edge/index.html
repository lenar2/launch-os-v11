<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Доверие Жизни</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f1eb;color:#211f1d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
.card{max-width:420px}
.mark{width:44px;height:44px;margin:0 auto 18px;display:grid;grid-template-columns:1fr 1fr;gap:5px;opacity:.3}
.mark i{display:block;background:#211f1d;border-radius:5px}
h1{font-family:Georgia,serif;font-size:24px;font-weight:500;margin:0 0 8px}
p{color:#716d66;line-height:1.5;margin:0 0 18px}
button{border:0;border-radius:12px;background:#211f1d;color:white;padding:13px 18px;font-size:15px;font-weight:700}
.small{font-size:12px;color:#8b847a;margin-top:16px}
</style>
</head>
<body>
<main><div class="card">
<div class="mark"><i></i><i></i><i></i><i></i></div>
<h1>Открываем «Доверие Жизни»</h1>
<p id="status">Подбираем самый быстрый маршрут…</p>
<button id="retry" hidden>Попробовать ещё раз</button>
<div class="small">Если один маршрут недоступен из-за VPN, мы автоматически попробуем другой.</div>
</div></main>
<script>
(() => {
  const EDGES = [
    "https://valued-revolutionary-lesson-commitments.trycloudflare.com",
    "https://diy-morgan-delivery-temple.trycloudflare.com",
    "https://yoga-arlington-durham-price.trycloudflare.com"
  ];
  const DIRECT = "https://api.lenarsalimov.ru";
  const status = document.getElementById("status");
  const retry = document.getElementById("retry");

  function targetParts() {
    const raw = location.hash.slice(1);
    if (!raw) throw new Error("missing target");
    const original = new URL(decodeURIComponent(raw));
    return original.pathname + original.search + original.hash;
  }

  async function probe(base, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      await fetch(base + "/p006/doverie/edge-health?ts=" + Date.now(), {
        mode: "no-cors",
        cache: "no-store",
        signal: controller.signal
      });
      return base;
    } finally {
      clearTimeout(timer);
    }
  }

  async function openApp() {
    retry.hidden = true;
    status.textContent = "Подбираем самый быстрый маршрут…";
    let path;
    try {
      path = targetParts();
    } catch (_) {
      status.textContent = "Ссылка устарела. Вернись в бот и открой подписку ещё раз.";
      return;
    }

    const attempts = EDGES.map(base => probe(base, 3500));
    try {
      const base = await Promise.any(attempts);
      location.replace(base + path);
      return;
    } catch (_) {}

    try {
      await probe(DIRECT, 2500);
      location.replace(DIRECT + path);
      return;
    } catch (_) {}

    status.textContent = "VPN не дал соединиться ни по одному маршруту. Попробуй ещё раз.";
    retry.hidden = false;
  }

  retry.addEventListener("click", openApp);
  openApp();
})();
</script>
</body>
</html>
