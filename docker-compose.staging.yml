name: launch-os-v11-staging

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-launch_os_v11_staging}
      POSTGRES_USER: ${POSTGRES_USER:-launch_os_v11}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for staging}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - launch_os_v11_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-launch_os_v11} -d ${POSTGRES_DB:-launch_os_v11_staging}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - launch_os_v11_staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: ${LAUNCH_OS_IMAGE:?set LAUNCH_OS_IMAGE for staging}
    environment:
      LAUNCH_OS_ENV: staging
      LAUNCH_OS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-launch_os_v11}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-launch_os_v11_staging}
      LAUNCH_OS_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "launch_os_v11.runtime.worker_main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: ${LAUNCH_OS_IMAGE:?set LAUNCH_OS_IMAGE for staging}
    environment:
      LAUNCH_OS_ENV: staging
      LAUNCH_OS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-launch_os_v11}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-launch_os_v11_staging}
      LAUNCH_OS_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "launch_os_v11.runtime.scheduler_main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  launch_os_v11_staging_pgdata:
  launch_os_v11_staging_redis:
